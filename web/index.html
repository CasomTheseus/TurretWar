<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurretWar · 炮台战争</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --table:#14110d; --table-2:#100e0a;
  --panel:#201a13; --panel-2:#191510; --raised:#2a2219;
  --line:rgba(232,220,196,.14); --line-2:rgba(232,220,196,.28);
  --text:#ece3d2; --muted:#b5a78f; --dim:#92836c;
  --paper:#e8dcc2; --paper-2:#ded0b2; --paper-line:rgba(36,31,23,.12);
  --ink:#241f17; --ink-2:#5d5241;
  --brass:#c99a4b; --brass-2:#e0b968;
  --bulwark:#3f7f78; --striker:#b4472f;
  --danger:#a33a2a; --danger-text:#d07a5f;
  --ok:#5d7a4e; --ok-text:#9bb783;
  --r:12px;
  --serif:"Songti SC","STSong","SimSun",Georgia,serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --t-fast:120ms; --t:180ms;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--table); color:var(--text);
  font:14px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ico-svg{width:16px;height:16px;display:block;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.app{
  height:100%; max-width:1600px; margin:0 auto;
  display:grid; grid-template-rows:auto minmax(0,1fr) auto;
  gap:16px; padding:20px 24px;
}

/* ============ 顶栏 ============ */
.topbar{display:flex;align-items:center;gap:24px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:230px}
.brand h1{margin:0;font:600 22px/1 var(--serif);letter-spacing:.01em;color:var(--text)}
.brand .sub{font-size:12px;color:var(--dim);letter-spacing:.02em;white-space:nowrap}
.turn{display:flex;align-items:center;gap:16px;flex:1;min-width:0}
.turn-label{font-size:13px;color:var(--muted);white-space:nowrap}
.turn-label b{font-size:18px;color:var(--text);font-weight:600;margin:0 1px}
.turn-label .total{color:var(--dim)}
.notches{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;
  flex:1;height:20px;align-items:end}
.notch{height:8px;background:var(--raised);border:1px solid var(--line);border-radius:1px;
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.notch.done{background:var(--brass);border-color:var(--brass)}
.notch.late{border-color:rgba(180,71,47,.35)}
.notch.now{background:var(--paper);border-color:var(--paper);transform:scaleY(2);transform-origin:bottom}
.notch.done.now{background:var(--brass-2)}
.turnwho{font-size:13px;color:var(--muted);white-space:nowrap;
  display:flex;align-items:center;gap:8px;min-width:120px;justify-content:flex-end}
.turnwho b{color:var(--text);font-weight:500}
.turnwho .dot{width:8px;height:8px;border-radius:2px;background:var(--dim);
  border:1px solid rgba(0,0,0,.25);flex:0 0 auto}

/* ============ 主区 ============ */
.board{
  display:grid;grid-template-columns:260px minmax(0,1fr) 260px;
  grid-template-areas:"s1 table s2";
  gap:16px;min-height:0;align-items:stretch;
}
#side1{grid-area:s1}
#side2{grid-area:s2}

/* ---- 军令卡 ---- */
.side{min-height:0;display:flex;width:100%;align-items:center}
.dossier{width:100%;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;
  transition:border-color var(--t) var(--ease)}
.side.active .dossier{border-color:var(--brass)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who-text{min-width:0}
.seal{width:40px;height:40px;flex:0 0 40px;border-radius:6px;display:grid;place-items:center;
  font:600 20px/1 var(--serif);color:var(--paper);
  border:1px solid rgba(0,0,0,.3);background:var(--bulwark)}
.who .name{font-size:16px;font-weight:600;color:var(--text);line-height:1.2}
.who .sub{font-size:12px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.active-tag{margin-left:auto;font-size:12px;color:var(--brass);
  border:1px solid var(--brass);border-radius:4px;padding:2px 6px;
  opacity:0;transition:opacity var(--t) var(--ease);flex:0 0 auto}
.side.active .active-tag{opacity:1}

.ledger{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:8px;
  padding:8px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.row:first-child{border-top:0}
.row .ico{color:var(--dim);display:grid;place-items:center}
.row b{font-size:14px;font-weight:600;color:var(--text)}
.hp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 0 8px 24px}
.hp .pip{height:6px;border-radius:1px;background:var(--raised);
  border:1px solid var(--line);
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease)}
.hp .pip.on{background:var(--ok);border-color:rgba(93,122,78,.7)}
.hp .pip.hurt{animation:hurt 260ms var(--ease)}
@keyframes hurt{0%,100%{transform:translateY(0)}40%{transform:translateY(-2px)}}
.pips-shield{display:flex;flex-wrap:wrap;gap:3px;padding:0 0 8px 24px;min-height:8px;align-items:center;gap:4px}
.pips-shield span{width:8px;height:8px;border-radius:1px;background:var(--raised);
  border:1px solid var(--line)}
.pips-shield span.on{background:var(--brass);border-color:var(--brass)}
.pips-shield span.new{animation:pop 220ms var(--ease)}
.pips-shield .more{font:500 12px/1 var(--mono);color:var(--dim);font-style:normal;margin-left:2px}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---- 沙盘 ---- */
.table{
  grid-area:table;position:relative;min-height:0;height:min(100%,420px);align-self:center;border-radius:var(--r);
  background:var(--paper);color:var(--ink);
  border:1px solid rgba(36,31,23,.42);
  box-shadow:0 20px 44px -30px rgba(0,0,0,.9);
  overflow:hidden;display:flex;flex-direction:column;
}
.table::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,transparent 0 159px,rgba(36,31,23,.17) 159px 160px),
    repeating-linear-gradient(90deg,transparent 0 159px,rgba(36,31,23,.17) 159px 160px),
    repeating-linear-gradient(0deg,transparent 0 39px,var(--paper-line) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,var(--paper-line) 39px 40px)}
.table-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px 16px 0;font-size:12px;color:var(--ink-2)}
.table-top .hint{color:var(--ink-2);text-align:center}
.field{position:relative;z-index:2;flex:1;display:grid;
  grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  padding:12px 20px 20px;min-height:0}
.field::before{content:"";position:absolute;left:0;right:0;top:50%;height:128px;
  transform:translateY(-50%);background:rgba(36,31,23,.045);
  border-top:1px solid rgba(36,31,23,.16);border-bottom:1px solid rgba(36,31,23,.16);
  pointer-events:none}
.force,.front{position:relative;z-index:1}
.force{display:flex;align-items:center;gap:12px;min-width:0}
.force-right{justify-content:flex-end}
.units{display:flex;align-items:center;gap:12px;min-width:0;overflow:hidden}
.force-right .units{flex-direction:row-reverse}
.group{display:flex;align-items:flex-end;gap:4px;min-width:0}
.group:empty{display:none}
.group.shields{flex-direction:column;gap:4px;align-items:flex-start}
.force-right .group.shields{align-items:flex-end}
.piece{display:block;flex:0 0 auto}
.piece.turret{width:16px;height:28px;background:var(--ink);border-radius:2px 2px 1px 1px;position:relative;box-shadow:0 2px 3px -2px rgba(36,31,23,.55)}
.piece.turret::before{content:"";position:absolute;left:6px;top:-6px;width:4px;height:8px;
  background:var(--brass);border-radius:1px}
.piece.shield{width:24px;height:8px;border-radius:1px;
  background:var(--faction,var(--bulwark));border:1px solid rgba(0,0,0,.25);box-shadow:0 2px 3px -2px rgba(36,31,23,.4)}
.more{font:500 12px/1 var(--mono);color:var(--ink-2);font-style:normal;padding:0 2px}
.base{position:relative;width:60px;height:84px;flex:0 0 60px;border-radius:4px;
  background:var(--ink);border:1px solid rgba(0,0,0,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  color:var(--paper);
  box-shadow:inset 0 2px 0 var(--faction,transparent),0 8px 14px -10px rgba(36,31,23,.55)}
.base .sig{font:600 20px/1 var(--serif)}
.base-hp{display:flex;gap:2px}
.base-hp i{display:block;width:8px;height:3px;background:rgba(232,220,198,.28)}
.base-hp i.on{background:var(--brass)}
.front{position:relative;align-self:stretch;width:1px;border-left:1px dashed rgba(36,31,23,.32)}
.front span{position:absolute;top:0;left:50%;transform:translateX(-50%);
  background:var(--paper);color:var(--ink-2);font-size:12px;padding:0 8px;white-space:nowrap}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* ============ 行动区 ============ */
footer{display:flex;flex-direction:column;gap:12px;min-height:0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.act{position:relative;text-align:left;padding:16px;border-radius:10px;
  background:var(--panel);border:1px solid var(--line);
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.act:hover:not(:disabled){background:var(--raised);border-color:var(--line-2)}
.act:active:not(:disabled){transform:scale(.99)}
.act:disabled{opacity:.45;cursor:not-allowed}
.act .k{position:absolute;top:8px;right:12px;width:20px;height:20px;
  display:grid;place-items:center;font:500 12px/1 var(--mono);color:var(--dim);
  border:1px solid var(--line);border-radius:3px;background:var(--panel-2)}
.act .head{display:flex;align-items:center;gap:8px;color:var(--muted)}
.act .t{font-size:15px;font-weight:500;color:var(--text)}
.act .d{display:block;font-size:12px;color:var(--muted);margin-top:4px;
  font-variant-numeric:tabular-nums}
.act.attack .head{color:var(--danger-text)}

.log-wrap{display:flex;flex-direction:column;gap:8px;min-height:0}
.log-head{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.log{height:104px;overflow:auto;background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 16px;font-size:12px;line-height:1.75;scrollbar-width:thin}
.log p{margin:0;color:var(--muted);display:flex;gap:8px}
.log p b{color:var(--text);font-weight:500}
.log p .t{color:var(--dim);font-family:var(--mono);font-size:12px;min-width:24px}
.log p.hit b{color:var(--danger-text)}
.log p.good b{color:var(--ok-text)}
.log p.gold b{color:var(--brass)}

/* ============ 弹窗 ============ */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;
  background:rgba(10,8,6,.97)}
.modal.hidden{display:none}
.sheet{width:min(820px,100%);max-height:calc(100vh - 48px);overflow:auto;animation:rise 240ms var(--ease)}
.modal-head h2{font:600 28px/1.2 var(--serif);margin:0 0 8px;color:var(--text)}
.modal-head p{margin:0 0 20px;color:var(--muted);font-size:13px;max-width:62ch}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pick{text-align:left;padding:20px;border-radius:12px;background:var(--paper);color:var(--ink);
  border:1px solid rgba(36,31,23,.4);
  transition:background-color var(--t) var(--ease),border-color var(--t) var(--ease),transform var(--t-fast) var(--ease)}
.pick:hover{background:#efe4cc;border-color:var(--brass)}
.pick:active{transform:scale(.995)}
.pick .ph{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pick .seal{background:var(--bulwark)}
.pick .nm{font:600 20px/1 var(--serif)}
.pick .doctrine{display:block;font-size:13px;color:var(--ink-2);margin:0 0 16px;line-height:1.6}
.pick .stats{display:flex;flex-direction:column;gap:0}
.pick .statline{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-top:1px solid rgba(36,31,23,.16);font-size:13px;color:var(--ink-2)}
.pick .statline b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink)}
.pick .go{display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;font-size:12px;color:var(--ink-2)}
.pick .go .arrow{color:var(--brass);font-size:14px}

.result{width:min(720px,100%);background:var(--paper);color:var(--ink);
  border:1px solid rgba(36,31,23,.4);border-radius:12px;padding:24px;
  animation:rise 240ms var(--ease)}
.result .kicker{font-size:12px;color:var(--ink-2)}
.result h2{font:600 32px/1.15 var(--serif);margin:8px 0}
.result .why{margin:0 0 16px;font-size:13px;color:var(--ink-2);line-height:1.6}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv .box{border:1px solid rgba(36,31,23,.2);border-radius:8px;padding:12px}
.kv .h{font-size:12px;color:var(--ink-2);margin-bottom:6px}
.kv .v{font-size:13px;line-height:1.75;font-variant-numeric:tabular-nums}
.again{width:100%;margin-top:16px;padding:12px 16px;border-radius:8px;
  background:var(--ink);color:var(--paper);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px}
.again:hover{background:#332b20}
.again .key{font:500 12px/1 var(--mono);border:1px solid rgba(232,220,196,.35);
  border-radius:3px;padding:2px 5px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 动效 ============ */
.shake{animation:shake 220ms var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-2px)}60%{transform:translateX(2px)}}
.flyer{position:fixed;width:6px;height:6px;border-radius:50%;
  background:var(--brass-2);pointer-events:none;z-index:30}
.ringfx{position:fixed;border-radius:50%;pointer-events:none;z-index:29;
  border:1px solid var(--c,var(--brass));animation:ring 360ms var(--ease) forwards}
@keyframes ring{from{transform:scale(.4);opacity:.9}to{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:1ms!important;transition-duration:1ms!important}
}

/* ============ 窄屏 ============ */
@media (max-width:1100px){
  .app{padding:16px 20px}
  .board{grid-template-columns:220px minmax(0,1fr) 220px}
  .brand{min-width:200px}
}
@media (max-width:900px){
  html,body{height:auto;min-height:100%}
  body{overflow:auto}
  .app{height:auto;min-height:100%;grid-template-rows:auto auto auto;gap:12px;padding:16px}
  .topbar{flex-wrap:wrap;gap:10px 12px}
  .brand{flex:1 1 100%;min-width:0}
  .turn{flex:1 1 100%;order:2;gap:12px}
  .turnwho{order:3;width:100%;justify-content:flex-start;min-width:0}
  .notches{max-width:none}
  .board{grid-template-columns:1fr 1fr;grid-template-areas:"table table" "s1 s2";gap:12px;align-items:start}
  .table{height:auto;min-height:320px}
  .dossier{padding:12px;gap:8px}
  .who{gap:8px}
  .seal{width:36px;height:36px;flex-basis:36px;font-size:18px}
  .who .sub{white-space:normal}
  .row{font-size:12px;padding:5px 0}
  .row b{font-size:13px}
  .hp{padding-left:24px}
  .pips-shield{padding-left:24px}
  .field{padding:8px 12px 12px;gap:8px}
  .field::before{height:96px}
  .table-top{padding:10px 12px 0}
  .table-top .hint{display:none}
  .force{gap:8px}
  .units{gap:8px}
  .base{width:40px;height:56px;flex-basis:40px}
  .piece.turret{width:8px;height:16px}
  .piece.turret::before{left:2px;width:4px;height:5px}
  .piece.shield{width:16px;height:4px}
  .actions{gap:8px}
  .act{padding:12px}
  .act .t{font-size:14px}
  .act .d{font-size:12px}
  .act .k{top:8px;right:8px;width:18px;height:18px}
  .log{height:140px}
  .picks{grid-template-columns:1fr}
  .modal{padding:16px}
  .result{padding:20px}
  .result h2{font-size:28px}
}
@media (max-width:360px){
  .brand .sub{display:none}
}
@media (max-width:520px){
  .active-tag{display:none}
  .brand h1{font-size:20px}
  .turn-label b{font-size:16px}
  .notches{gap:2px}
  .kv{grid-template-columns:1fr}
  .act .head svg{display:none}
  .act .t{font-size:13px}
}
</style>
</head>

      <path d="M8 2.5l4.5 1.8v3.4c0 2.7-2 4.8-4.5 5.8-2.5-1-4.5-3.1-4.5-5.8V4.3L8 2.5z"/>

  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>TurretWar</h1>
      <span class="sub">炮台战争 · 双人 24 手</span>
    </div>
    <div class="turn" aria-label="回合进度">
      <span class="turn-label">第 <b id="ply" class="mono">0</b> 手 <span class="total">/ 24</span></span>
      <div class="notches" id="notches" aria-hidden="true"></div>
    </div>
    <div class="turnwho" id="turnwho">选择阵营</div>
  </header>

  <main class="board">
    <section class="side" id="side1" aria-label="玩家1">
      <div class="dossier" id="card1">
        <div class="who">
          <div class="seal" id="badge1">壁</div>
          <div class="who-text">
            <div class="name" id="name1">壁垒</div>
            <div class="sub" id="sub1">造护盾 +3 · 炮台伤害 1</div>
          </div>
          <span class="active-tag" id="tag1">行动</span>
        </div>
        <div class="ledger">
          <div class="row">
            <span class="ico"><svg class="ico-svg" aria-hidden="true"><use href="#i-base"/></svg></span>
            <span>基地</span><b class="mono" id="hpNum1">3</b>
          </div>
          <div class="hp" id="hp1"></div>
          <div class="row">
            <span class="ico"><svg class="ico-svg" aria-hidden="true"><use href="#i-shield"/></svg></span>
            <span>护盾</span><b class="mono" id="shNum1">0</b>
          </div>
          <div class="pips-shield" id="shPips1"></div>
          <div class="row">
            <span class="ico"><svg class="ico-svg" aria-hidden="true"><use href="#i-turret"/></svg></span>
            <span>炮台</span><b class="mono" id="tuNum1">0</b>
          </div>
          <div class="row">
            <span class="ico"><svg class="ico-svg" aria-hidden="true"><use href="#i-flag"/></svg></span>
            <span>兵力</span><b class="mono" id="force1">0</b>
          </div>
        </div>
      </div>
    </section>

    <section class="table" id="mid" aria-label="战场">
      <canvas id="fx"></canvas>

<script id="rules-core">
/* ============================================================
 * TurretWar 3.0 规则核心 —— 纯函数，不碰 DOM。
 * 这段代码由 node 单测与 Python 求解器逐手对拍（见 verify.js）。
 * ============================================================ */
const TW = (() => {
  const BASE_HP = 3, BUDGET = 24, REFLECT_DIV = 2;
  const FACTIONS = {
    bulwark: { id:'bulwark', name:'壁垒', sigil:'壁', shieldGain:3, dmg:1, startShield:0, color:'#35c7d8' },
    striker: { id:'striker', name:'突击', sigil:'突', shieldGain:2, dmg:2, startShield:1, color:'#ff8a3d' },
  };
  const ACTIONS = ['buildTurret','buildShield','attack'];

  function newState(p1FactionId){
    const f1 = FACTIONS[p1FactionId] || FACTIONS.bulwark;
    const f2 = FACTIONS[f1.id === 'bulwark' ? 'striker' : 'bulwark'];
    const mk = (f) => ({ faction:f.id, hp:BASE_HP, turrets:0, shields:f.startShield,
                         builtTurrets:0, builtShields:0, dealt:0 });
    return { ply:0, p1:mk(f1), p2:mk(f2), over:false, winner:null, why:null };
  }

  function sideOf(s, who){ return who===1 ? s.p1 : s.p2; }
  function faction(s, who){ return FACTIONS[sideOf(s,who).faction]; }

  /* 伤害结算：护盾 -> 炮台 -> 基地；返回被护盾吸收的点数 */
  function applyDamage(side, dmg){
    let absorbed = 0;
    while (dmg > 0 && side.hp > 0){
      if (side.shields > 0){ side.shields--; absorbed++; }
      else if (side.turrets > 0){ side.turrets--; }
      else { side.hp--; }
      dmg--;
    }
    return absorbed;
  }

  /* 执行一步行动，返回事件列表（供 UI 播动画） */
  function step(state, who, action){
    if (state.over) return [];
    const s = state, me = sideOf(s, who), op = sideOf(s, who===1?2:1);
    const fm = FACTIONS[me.faction], fo = FACTIONS[op.faction];
    const ev = [{ type:'begin', who, action }];
    const snap = (x) => ({h:x.hp,t:x.turrets,s:x.shields});

    if (action === 'buildTurret'){
      me.turrets++; me.builtTurrets++;
      ev.push({ type:'turret', who, amount:1 });
    } else if (action === 'buildShield'){
      me.shields += fm.shieldGain; me.builtShields += fm.shieldGain;
      ev.push({ type:'shield', who, amount:fm.shieldGain });
    } else {
      const dmg = me.turrets * fm.dmg;
      if (dmg > 0 && op.hp > 0){
        const before = snap(op);
        const absorbed = applyDamage(op, dmg);
        const loss = (before.s-op.shields)+(before.t-op.turrets)+(before.h-op.hp);
        me.dealt += loss;
        ev.push({ type:'attack', who, target: who===1?2:1, dmg, absorbed, loss,
                  reflected:0, hitBase: before.h-op.hp });
        if (op.hp <= 0){
          s.over = true; s.winner = who; s.why = 'kill';
          ev.push({ type:'kill', who });
        } else {
          const refl = Math.floor(absorbed / REFLECT_DIV);
          if (refl > 0){
            const b2 = snap(me);
            applyDamage(me, refl);
            op.dealt += (b2.s-me.shields)+(b2.t-me.turrets)+(b2.h-me.hp);
            ev[ev.length-1].reflected = refl;
            ev.push({ type:'reflect', who, target:who, amount:refl });
            if (me.hp <= 0){ s.over = true; s.winner = who===1?2:1; s.why='reflect'; ev.push({type:'kill',who:s.winner}); }
          }
        }
      } else {
        ev.push({ type:'attack', who, target:who===1?2:1, dmg:0, absorbed:0, loss:0, reflected:0, hitBase:0 });
      }
    }

    if (!s.over){
      s.ply++;
      if (s.ply >= BUDGET){
        s.over = true;
        const judge = judgeDeadline(s);
        s.winner = judge; s.why = judge ? 'deadline' : 'draw';
        ev.push({ type:'deadline', winner:judge });
      }
    } else {
      s.ply++;
    }
    return ev;
  }

  function forces(side){ return side.turrets + side.shields; }

  function judgeDeadline(s){
    if (s.p1.hp !== s.p2.hp) return s.p1.hp > s.p2.hp ? 1 : 2;
    const f1 = forces(s.p1), f2 = forces(s.p2);
    if (f1 !== f2) return f1 > f2 ? 1 : 2;
    return 0;
  }

  function turnOf(s){ return s.ply % 2 === 0 ? 1 : 2; }   /* ply 已完成的步数 */

  return { BASE_HP, BUDGET, REFLECT_DIV, FACTIONS, ACTIONS, newState, step, judgeDeadline,
           forces, turnOf, sideOf, faction };
})();
if (typeof module !== 'undefined') module.exports = TW;
</script>

<script>
/* ============================================================
 * UI 层
 * ============================================================ */
(() => {
  const $ = (id) => document.getElementById(id);
  const el = {};

  let S = null;
  let busy = false;

  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const log = (txt, cls='') => {
    const p = document.createElement('p');
    if (cls) p.className = cls;
    const t = document.createElement('span'); t.className = 't';
    t.textContent = S ? String(S.ply).padStart(2,'0') : '';
    const b = document.createElement('span'); b.innerHTML = txt;
    p.appendChild(t); p.appendChild(b);
    el.log.appendChild(p);
    el.log.scrollTop = el.log.scrollHeight;
  };

  /* ---------- 渲染 ---------- */
  function paintNotches(ply, over){
    const ns = el.notches.children;
    for (let i = 0; i < ns.length; i++){
      ns[i].className = 'notch'
        + (i < ply ? ' done' : '')
        + (i === ply && !over ? ' now' : '')
        + (i >= 20 ? ' late' : '');
    }
  }

  function render(){
    if (!S) return;
    const p1 = S.p1, p2 = S.p2;
    const f1 = TW.FACTIONS[p1.faction], f2 = TW.FACTIONS[p2.faction];
    el.ply.textContent = S.ply;
    paintNotches(S.ply, S.over);

    const left = Math.max(0, TW.BUDGET - S.ply);
    const turn = S.over ? 0 : TW.turnOf(S);
    if (S.over){
      el.turnwho.innerHTML = '<span class="dot" style="background:var(--dim)"></span>对局结束';
    } else {
      const fac = TW.faction(S, turn);
      el.turnwho.innerHTML = `<span class="dot" style="background:${fac.color}"></span>轮到 <b>玩家${turn} · ${fac.name}</b>`;
    }

    fillSide(1, p1, f1);
    fillSide(2, p2, f2);

    el.side1.classList.toggle('active', turn === 1);
    el.side2.classList.toggle('active', turn === 2);

    $('laneName1').textContent = `P1 · ${f1.name}`;
    $('laneName2').textContent = `P2 · ${f2.name}`;
    $('laneHint').textContent = S.over ? '对局结束' : '超时比基地血与兵力';

    renderPieces(1, p1, f1);
    renderPieces(2, p2, f2);

    const cur = turn ? TW.sideOf(S, turn) : null;
    const fac = turn ? TW.faction(S, turn) : null;
    el.d0.textContent = cur ? `+1 座 · 现有 ${cur.turrets}` : '—';
    el.d1.textContent = cur ? `+${fac.shieldGain} · 现有 ${cur.shields}` : '—';
    el.d2.textContent = cur ? `炮台 ${cur.turrets} × ${fac.dmg} = ${cur.turrets*fac.dmg}` : '—';

    const dis = S.over || busy;
    [el.a0, el.a1, el.a2].forEach(b => b.disabled = dis);
  }

  function fillSide(n, p, f){
    const badge = $('badge'+n), name = $('name'+n), sub = $('sub'+n);
    badge.textContent = f.sigil; badge.style.background = f.color;
    const base = $('base'+n); if (base) base.style.setProperty('--faction', f.color);
    name.textContent = f.name;
    sub.textContent = `造盾 +${f.shieldGain} · 伤害 ${f.dmg}`;

    /* HP 段 */
    const hpBox = $('hp'+n);
    if (hpBox.childElementCount !== TW.BASE_HP){
      hpBox.innerHTML = '';
      for (let i = 0; i < TW.BASE_HP; i++){
        const d = document.createElement('div'); d.className = 'pip'; hpBox.appendChild(d);
      }
    }
    [...hpBox.children].forEach((d, i) => {
      const on = i < p.hp, was = d.classList.contains('on');
      d.classList.toggle('on', on);
      if (was && !on){ d.classList.remove('hurt'); void d.offsetWidth; d.classList.add('hurt'); }
    });

    $('hpNum'+n).textContent = p.hp;
    $('shNum'+n).textContent = p.shields;
    $('tuNum'+n).textContent = p.turrets;
    $('force'+n).textContent = TW.forces(p);

    /* 基地血量刻度 */
    const bh = $('baseHp'+n);
    [...bh.children].forEach((d, i) => d.classList.toggle('on', i < p.hp));

    /* 护盾计数：最多 8 个点，超出用 +N */
    const sp = $('shPips'+n);
    const shown = Math.min(8, p.shields);
    let more = sp.querySelector('.more');
    if (more) more.remove();
    let pips = [...sp.querySelectorAll('span')];
    while (pips.length < shown){
      const d = document.createElement('span');
      sp.appendChild(d); pips.push(d);
    }
    while (pips.length > shown){ pips.pop().remove(); }
    pips.forEach((d, i) => {
      const on = i < p.shields, was = d.classList.contains('on');
      d.classList.toggle('on', on);
      if (on && !was){ d.classList.remove('new'); void d.offsetWidth; d.classList.add('new'); }
    });
    if (p.shields > 8){
      more = document.createElement('em');
      more.className = 'more';
      more.textContent = '+' + (p.shields - 8);
      sp.appendChild(more);
    }
  }

  function renderPieces(n, p, f){
    const box = $('pieces'+n);
    box.style.setProperty('--faction', f.color);
    box.innerHTML = '';
    const tw = $('mid').clientWidth;
    const max = tw < 460 ? 3 : tw < 620 ? 4 : 6;

    const tg = document.createElement('div'); tg.className = 'group turrets';
    for (let i = 0; i < Math.min(p.turrets, max); i++){
      const d = document.createElement('i'); d.className = 'piece turret'; tg.appendChild(d);
    }
    if (p.turrets > max){
      const m = document.createElement('em'); m.className = 'more';
      m.textContent = '+' + (p.turrets - max); tg.appendChild(m);
    }

    const sg = document.createElement('div'); sg.className = 'group shields';
    for (let i = 0; i < Math.min(p.shields, max); i++){
      const d = document.createElement('i'); d.className = 'piece shield'; sg.appendChild(d);
    }
    if (p.shields > max){
      const m = document.createElement('em'); m.className = 'more';
      m.textContent = '+' + (p.shields - max); sg.appendChild(m);
    }

    box.appendChild(tg); box.appendChild(sg);
  }

  /* ---------- 动画 ---------- */
  function centerOf(node){
    const r = node.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  }

  function flyer(from, to, color, arc = 70, dur = 360){
    if (reduced()) return Promise.resolve();
    return new Promise(res => {
      const a = centerOf(from), b = centerOf(to);
      const d = document.createElement('div');
      d.className = 'flyer'; d.style.background = color;
      d.style.left = (a.x - 3) + 'px'; d.style.top = (a.y - 3) + 'px';
      document.body.appendChild(d);
      let done = false, timer = null;
      const finish = () => { if (done) return; done = true; if (timer) clearTimeout(timer); d.remove(); res(); };
      timer = setTimeout(finish, dur + 220);
      const t0 = performance.now();
      const tick = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        const x = a.x + (b.x - a.x) * k;
        const y = a.y + (b.y - a.y) * k - Math.sin(k * Math.PI) * arc;
        d.style.transform = `translate(${x - a.x}px,${y - a.y}px)`;
        if (k < 1) requestAnimationFrame(tick); else finish();
      };
      requestAnimationFrame(tick);
    });
  }

  function ringAt(node, color){
    if (reduced()) return;
    const c = centerOf(node);
    const d = document.createElement('div');
    d.className = 'ringfx';
    d.style.setProperty('--c', color);
    d.style.width = d.style.height = '40px';
    d.style.left = (c.x - 20) + 'px'; d.style.top = (c.y - 20) + 'px';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 400);
  }

  function shake(node){
    if (reduced()) return;
    node.classList.remove('shake'); void node.offsetWidth; node.classList.add('shake');
    setTimeout(() => node.classList.remove('shake'), 260);
  }

  /* 画布粒子 */
  const cvs = $('fx'); const ctx = cvs.getContext('2d');
  let parts = [], raf = null;
  function resize(){
    const r = cvs.getBoundingClientRect();
    cvs.width = Math.max(1, r.width * devicePixelRatio);
    cvs.height = Math.max(1, r.height * devicePixelRatio);
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }

  function burst(node, color, n = 10){
    if (reduced()) return;
    const c = centerOf(node), r = cvs.getBoundingClientRect();
    for (let i = 0; i < n; i++){
      const ang = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 2.6;
      parts.push({ x: c.x - r.left, y: c.y - r.top, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1,
                   life: 1, color, size: 1.2 + Math.random() * 1.6 });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  }

  function loop(){
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts){
      p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.024;
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (parts.length) raf = requestAnimationFrame(loop);
    else { raf = null; ctx.clearRect(0, 0, cvs.width, cvs.height); }
  }

  /* ---------- 行动流程 ---------- */
  const sleep = (ms) => new Promise(r => setTimeout(r, reduced() ? 0 : ms));

  async function play(actionName){
    if (!S || S.over || busy) return;
    busy = true; render();
    const who = TW.turnOf(S);
    const ev = TW.step(S, who, actionName);
    const myBase = who === 1 ? $('base1') : $('base2');
    const foeBase = who === 1 ? $('base2') : $('base1');
    const myUnits = who === 1 ? $('pieces1') : $('pieces2');
    const myFac = TW.faction(S, who);

    for (const e of ev){
      switch(e.type){
        case 'turret':
          log(`<b>玩家${e.who}</b> 建造炮台 +1`);
          ringAt(myBase, myFac.color);
          await sleep(140); break;
        case 'shield':
          log(`<b>玩家${e.who}</b> 建造护盾 +${e.amount}`, 'gold');
          ringAt(myBase, '#c99a4b');
          await sleep(140); break;
        case 'attack': {
          if (e.dmg === 0){ log(`<b>玩家${e.who}</b> 没有炮台，这次进攻空放`); break; }
          log(`<b>玩家${e.who}</b> 发起进攻：${e.dmg} 点伤害`);
          await flyer(myUnits, foeBase, myFac.color);
          burst(foeBase, myFac.color, 12);
          if (e.loss > 0) shake(foeBase);
          if (e.absorbed > 0) log(`护盾吸收 ${e.absorbed} 点`, 'gold');
          const turretLoss = e.loss - e.absorbed - e.hitBase;
          if (turretLoss > 0) log(`击毁炮台 ${turretLoss} 座`, 'hit');
          if (e.hitBase > 0) log(`<b>基地 -${e.hitBase}</b>`, 'hit');
          if (e.loss === 0) log('未造成伤害');
          render(); await sleep(220); break;
        }
        case 'reflect':
          log(`护盾反击：<b>玩家${e.who}</b> 受到 ${e.amount} 点反伤`, 'hit');
          await flyer(foeBase, myUnits, '#a33a2a', 50, 300);
          burst(myBase, '#a33a2a', 8); shake(myBase);
          render(); await sleep(160); break;
        case 'kill':
          log(`<b>玩家${e.who} 击毁对方基地</b>`, 'good');
          render(); await sleep(240); break;
        case 'deadline':
          log(e.winner ? `手数用尽，超时判分：<b>玩家${e.winner} 胜</b>` : '手数用尽，判和棋');
          break;
      }
    }
    busy = false;
    render();
    if (S.over) setTimeout(showEnd, 520);
  }

  /* ---------- 结算 ---------- */
  function showEnd(){
    const f1 = TW.FACTIONS[S.p1.faction], f2 = TW.FACTIONS[S.p2.faction];
    let title, why;
    if (S.why === 'kill'){ title = `玩家${S.winner} 击毁基地`; why = '在 24 手内击毁对方基地。'; }
    else if (S.why === 'reflect'){ title = `玩家${S.winner} 反伤获胜`; why = '进攻被护盾反弹，基地被击毁。'; }
    else if (S.why === 'deadline'){ title = `玩家${S.winner} 超时判分获胜`; why = '24 手用尽：先比基地血，再比剩余兵力。'; }
    else { title = '和棋'; why = '24 手用尽，基地血与剩余兵力相同。'; }
    $('endTitle').textContent = title;
    $('endWhy').textContent = why;
    $('endPly').textContent = S.ply;
    $('endH1').textContent = `玩家1 · ${f1.name}`;
    $('endH2').textContent = `玩家2 · ${f2.name}`;
    const line = (p) => `基地 ${p.hp} · 炮台 ${p.turrets} · 护盾 ${p.shields}<br>
      累计伤害 ${p.dealt} · 造炮台 ${p.builtTurrets} · 造护盾 ${p.builtShields}`;
    $('endV1').innerHTML = line(S.p1);
    $('endV2').innerHTML = line(S.p2);
    $('endModal').classList.remove('hidden');
  }

  /* ---------- 开局 ---------- */
  function start(factionId){
    S = TW.newState(factionId);
    busy = false;
    el.log.innerHTML = '';
    $('pickModal').classList.add('hidden');
    $('endModal').classList.add('hidden');
    resize();
    const f1 = TW.FACTIONS[S.p1.faction], f2 = TW.FACTIONS[S.p2.faction];
    log(`玩家1 选择 <b>${f1.name}</b>，玩家2 使用 <b>${f2.name}</b>`);
    log('24 手内击毁基地；超时比基地血与兵力');
    render();
  }

  /* ---------- 事件绑定 ---------- */
  document.addEventListener('DOMContentLoaded', () => {
    Object.assign(el, {
      ply: $('ply'), notches: $('notches'), turnwho: $('turnwho'),
      side1: $('side1'), side2: $('side2'), card1: $('card1'), card2: $('card2'),
      a0: $('a0'), a1: $('a1'), a2: $('a2'), d0: $('d0'), d1: $('d1'), d2: $('d2'),
      log: $('log'), base1: $('base1'), base2: $('base2'), pieces1: $('pieces1'), pieces2: $('pieces2')
    });

    for (let i = 0; i < TW.BUDGET; i++){
      const n = document.createElement('span');
      n.className = 'notch';
      el.notches.appendChild(n);
    }

    resize();
    [el.a0, el.a1, el.a2].forEach(b => b.addEventListener('click', () => play(TW.ACTIONS[+b.dataset.a])));
    addEventListener('keydown', (e) => {
      if (!$('endModal').classList.contains('hidden')){ if (e.key === 'r' || e.key === 'R') location.reload(); return; }
      if (!S || S.over) return;
      if (e.key === '1') play('buildTurret');
      if (e.key === '2') play('buildShield');
      if (e.key === '3') play('attack');
    });
    document.querySelectorAll('.pick').forEach(p => p.addEventListener('click', () => start(p.dataset.f)));
    $('againBtn').addEventListener('click', () => location.reload());
    render();

    let rt;
    addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { resize(); if (S) render(); }, 80);
    });

    /* 交互自测：#autoplay 走真实 play() 路径（含动画），用于无头验证 */
    if (location.hash.indexOf('autoplay') >= 0) {
      setTimeout(async () => {
        start('striker');
        for (const a of ['buildTurret','buildTurret','buildShield','buildTurret','attack']) {
          await play(a);
        }
        document.title = 'AUTOPLAY-OK ply=' + S.ply;
      }, 30);
    }

    /* 演示模式：#demo 直接进入中局，便于截图/预览 */
    if ((location.search + location.hash).indexOf('demo') >= 0) {
      setTimeout(() => {
        start('striker');
        const seq = ['buildTurret','buildTurret','buildShield','buildTurret','attack',
                     'buildShield','attack','buildTurret','attack','buildShield'];
        for (const a of seq) {
          if (S.over) break;
          const who = TW.turnOf(S);
          const ev = TW.step(S, who, a);
          const hit = ev.find(e => e.type === 'attack');
          if (a === 'attack') {
            const base = hit.hitBase > 0 ? ` · 基地 -${hit.hitBase}` : ' · 基地未受损';
            log(`<b>玩家${who}</b> 进攻 ${hit.dmg} 点 · 护盾吸收 ${hit.absorbed}${base}`);
          }
          else if (a === 'buildShield') log(`<b>玩家${who}</b> 建造护盾`, 'gold');
          else log(`<b>玩家${who}</b> 建造炮台`);
        }
        render();
        log('演示中局 · 已走 10 手');
      }, 40);
    }
  });
})();
</script>
</body>
</html>
